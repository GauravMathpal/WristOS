<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fav-bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140e2b" />
      <stop offset="1" stop-color="#07050e" />
    </linearGradient>
    <linearGradient id="fav-border-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="0.5" stop-color="#F472B6" />
      <stop offset="1" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="fav-w-grad" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD" />
      <stop offset="0.5" stop-color="#F472B6" />
      <stop offset="1" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="url(#fav-bg-grad)" stroke="url(#fav-border-grad)" stroke-width="1" />
  <!-- Stylized Futuristic W -->
  <path d="M5.5 8L10 24L16 13L22 24L26.5 8" stroke="url(#fav-w-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#fav-glow)" />
  <!-- Luminous Apex Star / AI Dot -->
  <circle cx="16" cy="7.5" r="2.2" fill="#F472B6" />
  <circle cx="16" cy="7.5" r="1.2" fill="#FFFFFF" />
</svg>
